# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /choreography

# Application Name
spring:
  application:
    name: saga-choreography
  
  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:choreographydb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  
  # SQL Initialization
  sql:
    init:
      mode: always

# Logging Configuration
logging:
  level:
    org.springframework: INFO
    tr.com.mcay.choreography: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n" 