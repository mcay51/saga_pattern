server:
  port: 8080

spring:
  application:
    name: saga-orchestration-service
  datasource:
    url: jdbc:h2:mem:sagadb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Servis URL'leri
service:
  order:
    url: http://localhost:8081
  payment:
    url: http://localhost:8082
  inventory:
    url: http://localhost:8083 